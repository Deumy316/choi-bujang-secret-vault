<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 최부장의 자료실</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101a28;
      color: #ecf4ff;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 44px 22px 64px;
    }

    .eyebrow {
      color: #8ad8df;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    h1 {
      margin: 16px 0;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.2;
    }

    h2 {
      margin-top: 28px;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
      color: #bfd0e5;
    }

    .box {
      margin: 26px 0;
      padding: 20px;
      border: 1px solid #51667c;
      border-radius: 14px;
      background: #162438;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    label {
      font-weight: 700;
    }

    input,
    textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #51667c;
      border-radius: 9px;
      background: #0f1b2b;
      color: #ecf4ff;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    #loginButton,
    #createButton {
      background: #8ad8df;
      color: #10202b;
    }

    #logoutButton,
    .deleteButton {
      background: #d07384;
      color: white;
    }

    .editButton {
      background: #b8c9dd;
      color: #10202b;
    }

    #authStatus,
    #noteStatus {
      margin-top: 14px;
      color: #bfd0e5;
    }

    .error {
      color: #ff9dad !important;
    }

    ul {
      list-style: none;
      display: grid;
      gap: 12px;
      padding: 0;
    }

    li {
      border: 1px solid #51667c;
      border-radius: 14px;
      padding: 17px 19px;
      background: #1a2a3d;
    }

    strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    li span {
      display: block;
      color: #bfd0e5;
      white-space: pre-wrap;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계</div>
    <h1>최부장의 자료실</h1>

    <p>
      로그인한 사용자는 가상 메모를 조회하고 추가·수정·삭제할 수 있습니다.
    </p>

    <section class="box">
      <h2>로그인</h2>

      <form id="loginForm">
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>

        <button id="loginButton" type="submit">로그인</button>
      </form>

      <button id="logoutButton" type="button" hidden>로그아웃</button>

      <div id="authStatus" aria-live="polite">
        로그인 상태를 확인하는 중입니다.
      </div>
    </section>

    <section id="createBox" class="box" hidden>
      <h2>새 메모 추가</h2>

      <form id="createForm">
        <div class="field">
          <label for="noteTitle">제목</label>
          <input id="noteTitle" type="text" required>
        </div>

        <div class="field">
          <label for="noteBody">내용</label>
          <textarea id="noteBody" required></textarea>
        </div>

        <button id="createButton" type="submit">메모 추가</button>
      </form>

      <div id="noteStatus" aria-live="polite"></div>
    </section>

    <h2>가상 메모</h2>

    <ul id="notes" aria-live="polite">
      <li>로그인하면 가상 메모를 볼 수 있습니다.</li>
    </ul>
  </main>

  <script type="module">

    var loginForm = document.querySelector('#loginForm');
    var logoutButton = document.querySelector('#logoutButton');
    var authStatus = document.querySelector('#authStatus');
    var emailInput = document.querySelector('#email');
    var passwordInput = document.querySelector('#password');

    var createBox = document.querySelector('#createBox');
    var createForm = document.querySelector('#createForm');
    var noteTitleInput = document.querySelector('#noteTitle');
    var noteBodyInput = document.querySelector('#noteBody');
    var noteStatus = document.querySelector('#noteStatus');

    var list = document.querySelector('#notes');

    var SESSION_KEY = 'byteback_session';

    function saveSession(accessToken, email) {
      sessionStorage.setItem(
        SESSION_KEY,
        JSON.stringify({
          access_token: accessToken,
          user: {
            email: email
          }
        })
      );
    }

    function clearSession() {
      sessionStorage.removeItem(SESSION_KEY);
    }

    async function getSession() {
      var saved = sessionStorage.getItem(SESSION_KEY);

      if (!saved) {
        return null;
      }

      try {
        var session = JSON.parse(saved);

        if (
          !session ||
          typeof session.access_token !== 'string' ||
          !session.access_token
        ) {
          clearSession();
          return null;
        }

        return session;
      } catch (error) {
        clearSession();
        return null;
      }
    }

    async function apiFetch(url, options) {
      var session = await getSession();

      if (!session) {
        throw new Error('로그인이 필요합니다.');
      }

      var fetchOptions = options || {};
      var headers = fetchOptions.headers || {};

      headers.Authorization = 'Bearer ' + session.access_token;

      if (fetchOptions.body) {
        headers['Content-Type'] = 'application/json';
      }

      fetchOptions.headers = headers;
      fetchOptions.cache = 'no-store';

      var response = await fetch(url, fetchOptions);

      var data = await response.json().catch(function () {
        return {};
      });

      if (!response.ok) {
        throw new Error(data.error || '요청을 처리하지 못했습니다.');
      }

      return data;
    }

    function showLoggedOut(message) {
      loginForm.hidden = false;
      logoutButton.hidden = true;
      createBox.hidden = true;

      authStatus.classList.remove('error');
      authStatus.textContent =
        message || '로그인하지 않은 상태입니다.';
    }

    function showLoggedIn(user) {
      loginForm.hidden = true;
      logoutButton.hidden = false;
      createBox.hidden = false;

      authStatus.classList.remove('error');
      authStatus.textContent = '로그인됨: ' + user.email;
    }

    async function refreshAuthState() {
      var session = await getSession();

      if (session && session.user) {
        showLoggedIn(session.user);
      } else {
        showLoggedOut();
      }
    }

    loginForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      authStatus.classList.remove('error');
      authStatus.textContent = '로그인 중입니다.';

      try {
        var response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: emailInput.value,
            password: passwordInput.value
          }),
          cache: 'no-store'
        });

        var data = await response.json().catch(function () {
          return {};
        });

        if (!response.ok) {
          throw new Error(data.error || '로그인에 실패했습니다.');
        }

        saveSession(
          data.access_token,
          data.user.email
        );

        passwordInput.value = '';

        showLoggedIn(data.user);
        await loadNotes();
      } catch (error) {
        authStatus.classList.add('error');
        authStatus.textContent =
          '로그인 실패: ' + error.message;
      }
    });

    logoutButton.addEventListener('click', async function () {
      clearSession();

      showLoggedOut('로그아웃하였습니다.');
      await loadNotes();
    });

    createForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      noteStatus.classList.remove('error');
      noteStatus.textContent = '메모를 추가하는 중입니다.';

      try {
        await apiFetch('/api/notes', {
          method: 'POST',
          body: JSON.stringify({
            title: noteTitleInput.value,
            body: noteBodyInput.value
          })
        });

        noteTitleInput.value = '';
        noteBodyInput.value = '';

        noteStatus.textContent = '메모가 추가되었습니다.';

        await loadNotes();
      } catch (error) {
        noteStatus.classList.add('error');
        noteStatus.textContent = error.message;
      }
    });

    async function editNote(note) {
      var newTitle = window.prompt('새 제목을 입력하세요.', note.title);

      if (newTitle === null) {
        return;
      }

      var newBody = window.prompt('새 내용을 입력하세요.', note.body);

      if (newBody === null) {
        return;
      }

      try {
        await apiFetch('/api/notes/' + encodeURIComponent(note.id), {
          method: 'PUT',
          body: JSON.stringify({
            title: newTitle,
            body: newBody
          })
        });

        await loadNotes();
      } catch (error) {
        window.alert(error.message);
      }
    }

    async function deleteNote(note) {
      var confirmed = window.confirm(
        '"' + note.title + '" 메모를 삭제할까요?'
      );

      if (!confirmed) {
        return;
      }

      try {
        await apiFetch('/api/notes/' + encodeURIComponent(note.id), {
          method: 'DELETE'
        });

        await loadNotes();
      } catch (error) {
        window.alert(error.message);
      }
    }

    async function loadNotes() {
      var session = await getSession();

      if (!session) {
        var loggedOutItem = document.createElement('li');
        loggedOutItem.textContent =
          '로그인하면 가상 메모를 볼 수 있습니다.';

        list.replaceChildren(loggedOutItem);
        return;
      }

      try {
        var data = await apiFetch('/api/notes', {
          method: 'GET'
        });

        if (!Array.isArray(data.notes)) {
          throw new Error('가상 메모 형식이 올바르지 않습니다.');
        }

        var items = data.notes.map(function (note) {
          var item = document.createElement('li');

          var title = document.createElement('strong');
          title.textContent = note.title;

          var body = document.createElement('span');
          body.textContent = note.body;

          var actions = document.createElement('div');
          actions.className = 'actions';

          var editButton = document.createElement('button');
          editButton.type = 'button';
          editButton.className = 'editButton';
          editButton.textContent = '수정';

          editButton.addEventListener('click', function () {
            editNote(note);
          });

          var deleteButton = document.createElement('button');
          deleteButton.type = 'button';
          deleteButton.className = 'deleteButton';
          deleteButton.textContent = '삭제';

          deleteButton.addEventListener('click', function () {
            deleteNote(note);
          });

          actions.append(editButton, deleteButton);
          item.append(title, body, actions);

          return item;
        });

        if (items.length === 0) {
          var emptyItem = document.createElement('li');
          emptyItem.textContent = '등록된 메모가 없습니다.';
          items.push(emptyItem);
        }

        list.replaceChildren(...items);
      } catch (error) {
        var errorItem = document.createElement('li');
        errorItem.textContent = error.message;
        list.replaceChildren(errorItem);
      }
    }

    await refreshAuthState();
    await loadNotes();
  </script>
</body>

</html>
